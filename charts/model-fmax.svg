  <g id="text_29">
   <text style="fill: #5b607d; font: 8.5px 'DejaVu Sans'" transform="translate(34.56 559.716781)">Preliminary results as of 2026-11-18 11:08 PST: 120 of 160 sessions finished.</text>
   <text style="fill: #5b607d; font: 8.5px 'DejaVu Sans'" transform="translate(34.56 571.818391)">Stock coding agents, one session per model and design, at most 10 evaluations each. boson synthesis and unplaced setup timing on public ASAP7 TT</text>
   <text style="fill: #5b607d; font: 8.5px 'DejaVu Sans'" transform="translate(34.56 583.92)">libraries, 1 ps period search; a candidate counts only with an EQY equivalence proof against the original RTL.</text>
